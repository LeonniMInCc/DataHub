server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/datahub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=DataHubSecretKey2026ForJWTTokenGenerationAndValidationMustBeLongEnough
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173
