server.port=8080

# Demo database. The default application.properties still uses MySQL.
spring.datasource.url=jdbc:h2:mem:datahub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo-schema.sql
spring.sql.init.data-locations=classpath:demo-data.sql
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=DataHubSecretKey2026ForJWTTokenGenerationAndValidationMustBeLongEnough
app.jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
